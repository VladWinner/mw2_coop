name: PR checks

# Runs on every pull request to main (and when a PR gets new commits). Two independent jobs:
#   Checks  tools/pr_checks.py: patch hunks well formed, scripts balanced, no game files, no personal paths,
#           (warning) changelog entries in both languages
#   Build   the 64-bit and 32-bit archives are built with the real release script; they are kept as
#           workflow artifacts for 14 days so a reviewer can try the PR's build
# Needs no game files and no secrets, so it is safe for pull requests from forks (read-only token).
# NOT checked here: that the patches apply to the game's scripts (tools/check_patches.py needs the extracted game
# scripts) and that the mod runs. Run those locally.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # llvm-mingw, the toolchain build.sh uses, pinned by version and SHA-256 (release 20261006 of mstorsjo/llvm-mingw)
  LLVM_MINGW_VERSION: "20261006"
  LLVM_MINGW_SHA256: "5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Static checks
        run: python3 -I tools/pr_checks.py --base "${{ github.event.pull_request.base.sha }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install llvm-mingw (pinned)
        run: |
          name="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.tar.xz"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/${name}" >> "$GITHUB_ENV"

      - name: Build the two archives
        run: |
          version="pr${{ github.event.pull_request.number }}-${GITHUB_SHA:0:7}"
          sh tools/make_release.sh "$version"
          sh tools/make_release.sh "$version" x86
          ls -l dist/*.zip

      - name: Keep the archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-${{ github.event.pull_request.number }}-build
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14
