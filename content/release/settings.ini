; mw2coop settings

[network]
; The game's network port: the host listens on it, and joining uses it.
; Both players need the same port. Change it only if 28960 is taken or blocked.
port=28960
; 1: a Steam invite's game traffic goes through Steam (works behind any NAT, including the
; provider's). Both players need the same setting. Not tested with two real accounts yet.
steam_relay=0
