; mw2coop settings

[network]
; The game's network port: the host listens on it, and joining uses it.
; Both players need the same port. Change it only if 28960 is taken or blocked.
port=28960
; 1: a Steam invite's game traffic goes through Steam (works behind any NAT, including the
; provider's). Both players need the same setting. Played by two real players on one mission (Cliffhanger): it worked.
steam_relay=0
; 1 (the default): packets that no co-op session sends are dropped before the game sees them: the multiplayer's party join (joinParty, a known stack overflow of the game) and rcon, a
; co-op command from a machine that is not your partner, and a map name with a command separator (text after a ";" in it would run as console commands). The log says "guard dropped" for each.
; 0: the game sees everything, as it did before. Turn it off only if a session that works without it is cut by it.
guard=1

[display]
; 1: in the Russian game the menus, subtitles and mission texts use the mod's fonts (the H*-Mod fonts,
; folder mw2coop\fonts), closer to the English original. 0: the game's own font.
fonts=1
; 1: the mod's font atlas is filtered between its mip levels (trilinear), so small text is smooth instead of sharp
; and jagged. 0: the game's plain bilinear filter. Only matters when the fonts above are on.
fontmip=1
; 1: the game window gets the dark title bar and square corners of current Windows (Windows 10 / 11), while it has a title bar
; (windowed mode); borderless and full screen are left alone. 0: the title bar the game makes.
darktitle=1
; Size of the objective pointer labels ("Follow", "Protect", the distance such as "2.0m") in percent of the game's own
; (20-200). 100: the game's size. A size you set yourself with the game's dvar objectiveFontSize is left alone.
hudtextscale=50
; The same for the names over other players (dvars friendlyNameFontSize, friendlyNameFontSizeSplitscreen).
nametagscale=70
; Work in progress, leave it at 0: the game would use the extended Direct3D 9 (the same trick as the iw4x client), so that Alt+Tab out of full screen does not lose the
; graphics device (in co-op the partner is not left waiting for you). Alt+Tab works with it, but vid_restart and alt+enter hang the game: leave it at 0.
d3d9ex=0
; 1 (the default): the game's exclusive full screen is made a window of the whole screen without a border. Alt+Tab then does not lose the graphics device: in exclusive full screen a
; game left in the background froze its partner in co-op ("no signal for 10 s"), crashed afterwards and, in split screen, crashed on the way back; vid_restart and alt+enter work. 0: the game's
; own exclusive full screen (the hardware gamma ramp of hwgamma=1 applies only there).
borderless=1
; Experimental, 0 (off) by default: the game's Direct3D 9 runs on top of Windows' Direct3D 12 (Direct3DCreate9On12), the way to DX12 and, through D3D11On12, DX11 (upscalers such as DLSS and FSR 3
; need one of them). Window mode gets the flip model swap chain of Direct3D 9Ex (needed on laptops where an NVIDIA chip renders and the other chip shows the picture); it has no multisampled back buffer, so the
; game's antialiasing of the back buffer is off in window mode. Exclusive full screen also works (borderless=0 with it). d3d9on12_adapter=<n> picks the graphics adapter by its index (default: the one that has the primary monitor); the log lists them.
d3d9on12=0
; Experimental, 0 (off) by default: FSR 1 upscaling. The game renders at the size of its own video settings (Options > Video, or r_customMode) and the picture is upscaled to upscale_width x
; upscale_height (the size of the window and of the screen picture) with AMD's FSR 1 (edge-adaptive upscaling and sharpening). upscale_sharpness: the sharpening reduction in hundredths of a stop
; (0 = the strongest, 25 = the default). Not working yet with split screen; the mouse scaling in the menus is in but not yet seen working.
upscale=0
; Experimental, 0 (off) by default: AMD's FSR 3 on the game's frame, on the Direct3D 12 layer (it switches d3d9on12 on). fsr3_dir: the folder with AMD's amd_fidelityfx_loader_dx12.dll and
; amd_fidelityfx_upscaler_dx12.dll (from AMD's FidelityFX SDK release; the mod does not ship them). The game renders at its own size and FSR 3 makes upscale_width x upscale_height from it (set both below).
; fsr3_sharpness: FSR's sharpening, 0-100, default 60 (0 = off).
; 64-bit build only: AMD's DLLs are 64-bit, so the 32-bit and iw4x builds ignore fsr3=1 (FSR 1, upscale=1, works there).
fsr3=0
;fsr3_sharpness=60
; fsr3_lodbias: the texture sharpness bias with FSR 3 (empty = AMD's -1.58 for 1280x720 -> 1920x1080; nearer 0 = less shimmer on grass and fences, softer textures).
;fsr3_lodbias=
;fsr3_dir=C:/path/to/FidelityFX/signedbin
;upscale_width=1920
;upscale_height=1080
;upscale_sharpness=25

[russian]
; 1: the Russian voice archives you put in the folder mw2coop\voicefix (files named localized_russian_iw*.iwd) are linked into the game's main folder at start,
; so the game plays them after its own: the community voice fixes "Исправление локализации CoD MW2" (Rus-Licenzer, over the 1C localization) are made for that. The mod does not ship them:
; their readme forbids spreading them without the author's name. A file already in main is never replaced. 0: what the mod linked is removed again at the next start.
voicefix=0

[console]
; 1: the developer console switches sv_cheats on at every start (cheats change what a campaign counts); 0 (the default): the game's own value. Pause mode of the console does nothing in a
; co-op session (it would stop the partner). The console keeps its other settings (layout, language, pinned dvars) in this section.
sv_cheats_default=0

[gameplay]
; Options of the session, the same as the console dvars of the same names (the host's values go to the other player with the launch). Leave a line out for the game's own value.
; fall_damage=0 : no fall damage. jump_height=<1-1000> : how high a jump goes (the game's own is 39). gravity=<1-5000> : the game's own is 800.
;fall_damage=0
;jump_height=60
;gravity=800

[discord]
; Discord presence (the mission and "Solo" / "Split screen" / "Co-op" under the game's name in your Discord). Off until you put the id of a Discord application here (digits):
; create one at discord.com/developers/applications, copy its Application ID. Nothing is sent anywhere but to your own Discord client on this PC.
;client_id=
