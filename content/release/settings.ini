; mw2coop settings

[network]
; The game's network port: the host listens on it, and joining uses it.
; Both players need the same port. Change it only if 28960 is taken or blocked.
port=28960
; 1: a Steam invite's game traffic goes through Steam (works behind any NAT, including the
; provider's). Both players need the same setting. Played by two real players on one mission (Cliffhanger): it worked.
steam_relay=0

[display]
; 1: in the Russian game the menus, subtitles and mission texts use the mod's fonts (the H*-Mod fonts,
; folder mw2coop\fonts), closer to the English original. 0: the game's own font.
fonts=1
; 1: the mod's font atlas is filtered between its mip levels (trilinear), so small text is smooth instead of sharp
; and jagged. 0: the game's plain bilinear filter. Only matters when the fonts above are on.
fontmip=1
; 1: the game window gets the dark title bar and square corners of current Windows (Windows 10 / 11), while it has a title bar
; (windowed mode); borderless and full screen are left alone. 0: the title bar the game makes.
darktitle=1
; Size of the objective pointer labels ("Follow", "Protect", the distance such as "2.0m") in percent of the game's own
; (20-200). 100: the game's size. A size you set yourself with the game's dvar objectiveFontSize is left alone.
hudtextscale=50
; The same for the names over other players (dvars friendlyNameFontSize, friendlyNameFontSizeSplitscreen).
nametagscale=70
; Work in progress, leave it at 0: the game would use the extended Direct3D 9 (the same trick as the iw4x client), so that Alt+Tab out of full screen does not lose the
; graphics device (in co-op the partner is not left waiting for you). It does not work yet.
d3d9ex=0

[russian]
; 1: the Russian voice archives you put in the folder mw2coop\voicefix (files named localized_russian_iw*.iwd) are linked into the game's main folder at start,
; so the game plays them after its own: the community voice fixes "Исправление локализации CoD MW2" (Rus-Licenzer, over the 1C localization) are made for that. The mod does not ship them:
; their readme forbids spreading them without the author's name. A file already in main is never replaced. 0: what the mod linked is removed again at the next start.
voicefix=0
